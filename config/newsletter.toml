# AutoAX 데일리 뉴스레터 설정
# 이 파일만 고치면 받는 사람, 주제, 관점, 발송 시각을 바꿀 수 있습니다.

# 받을 Gmail 주소 (예시 값 그대로면 발송 단계에서 멈춥니다)
recipient = "your-address@gmail.com"
sender_name = "AutoAX 브리핑"

language = "ko"
timezone = "Asia/Seoul"
send_time = "07:00"

# rotate: 날짜마다 주제 하나씩 돌아가며 / fixed: 항상 첫 번째 주제
topic_mode = "rotate"

items_per_perspective = 3
lookback_hours = 24        # 결과가 적으면 72시간까지 늘려 다시 찾습니다

# 리서치는 로그인·결제 없이 읽을 수 있는 공개 소스만 씁니다.
# 아래 도메인은 검색 단계에서 아예 제외합니다 (유료 구독·로그인 필요).
# 목록에 없더라도 원문이 로그인·결제 화면으로 막히면 리서처가 버립니다.
blocked_domains = [
  "wsj.com", "ft.com", "bloomberg.com", "economist.com", "nytimes.com",
  "washingtonpost.com", "theinformation.com", "medium.com",
  "linkedin.com", "facebook.com", "instagram.com", "x.com", "twitter.com",
]

# 관심 주제 — 필요한 만큼 [[topics]] 블록을 추가하세요.
[[topics]]
name = "AI 에이전트"
keywords = ["AI agent", "AI 에이전트", "agentic AI", "Claude", "LLM"]
perspectives = ["기술 동향", "산업·비즈니스", "정책·규제"]
exclude = ["코인", "광고"]

[[topics]]
name = "업무 자동화"
keywords = ["업무 자동화", "RPA", "workflow automation", "AX", "AI 전환"]
perspectives = ["도구·제품", "도입 사례", "생산성 연구"]
exclude = []

# 예약 작업 정보 (newsletter-schedule 스킬이 등록 후 채웁니다)
# schedule_id = ""
